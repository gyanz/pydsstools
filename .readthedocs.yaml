# ReadTheDocs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    # Install pre-built wheel from PyPI (can't compile Cython on RTD)
    # Note: docs will reflect the PyPI version, not the current branch
    - requirements: docs/requirements.txt
