# Refer to PEP 621, 518 and 517
[build-system]
# NumPy 2.0 Compatibility Strategy:
# - Build with NumPy 1.x for Python 3.8-3.12 (forward-compatible with NumPy 2.x via stable C API)
# - Build with NumPy 2.x for Python 3.13+ (NumPy 1.x doesn't support Python 3.13)
# - Cython 3.0+ is required for full NumPy 2.0 support (handles NPY_2_0_API changes)
# - Minimum versions match runtime dependencies to ensure Cython compatibility
requires = [
    "setuptools>=61.0",
    "Cython>=3.0.0",
    "versioneer[toml]",
    "numpy>=1.21.5,<2; python_version>='3.9' and python_version<'3.10'",
    "numpy>=1.23.2,<2; python_version>='3.10' and python_version<'3.11'",
    "numpy>=1.26.0,<2; python_version>='3.11' and python_version<'3.13'",
    "numpy>=2.1.0; python_version>='3.13'",
]
build-backend = "setuptools.build_meta"

[project]
name = "pydsstools"
dynamic = [
    "version"
]
description = "Python library to read-write HEC-DSS database file"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Gyan Basyal", email = "gyanBasyalz@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # NumPy version constraints supporting both NumPy 1.x and 2.x:
    "numpy>=1.21.5,<2; python_version>='3.9' and python_version<'3.10'",
    "numpy>=1.23.2,<2; python_version>='3.10' and python_version<'3.11'",
    "numpy>=1.26.0,<2; python_version>='3.11' and python_version<'3.13'",
    "numpy>=2.1.0; python_version>='3.13'",
    "pandas",
    "affine",
    "pyproj",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
geo = [
    "pyogrio",
    "geopandas",
    "rasterio >= 1.2.1",
    "matplotlib"
]
test = ["pytest", "pytest-cov", "pytest-order"]
doc = ["myst-parser>=4.0.1", "sphinx>=8.2.3", "sphinx-rtd-theme", 
       "sphinx-autodoc-typehints", "autodoc-pydantic>=2.0.0"]

[project.urls]
repository = "https://github.com/gyanz/pydsstools"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = [
    'pydsstools',
    'pydsstools._lib',
    'pydsstools._lib.x64',
    'pydsstools._lib.x86',
    'pydsstools.core',
    'pydsstools.core.gridinfo',
    'pydsstools.core.gridinfo.v6',
    'pydsstools.heclib',
    'pydsstools.heclib.dss',
    'pydsstools.utils',
]
namespaces = false


[tool.setuptools.package-data]
pydsstools = ['src/*.pyx','src/*.pxd' 
]

[tool.distutils.build_ext]
inplace = false

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "pydsstools/_version.py"
versionfile_build  = "pydsstools/_version.py"
tag_prefix = ""      
parentdir_prefix = "pydsstools-"

[tool.black]
line-length = 88
target-version = ["py39","py310","py311","py312","py313"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Core quality + import sorting via Ruff (no isort needed)
select = ["E", "F", "I", "UP", "B", "SIM"]
# Avoid clashes with Black / long-line double-reporting
ignore = ["E203", "E501"]

[tool.ruff.lint.per-file-ignores]
# re-export patterns are fine
"**/__init__.py" = ["F401"]   

# Optional: NumPy docstring checks
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.cython-lint]
max-line-length = 88
ignore = ["E203", "E501"]

[tool.docformatter]
wrap_summaries = 88
wrap_descriptions = 88
pre_summary_newline = true
make_summary_multi_line = true
force_wrap = false
tab_width = 4

[tool.pytest.ini_options]
minversion = "6.0"
# quietly shows all extra test summary except passed
addopts = "-ra -v --import-mode=importlib "
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
xfail_strict = true
